    <!-- كود فايربيس وتشغيل المصادقة -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDBZGXlXxyNUVJhT12Dq1qKEBtnLuGbMY4",
          authDomain: "abdo-saad-educational-pl-7bb2e.firebaseapp.com",
          projectId: "abdo-saad-educational-pl-7bb2e",
          storageBucket: "abdo-saad-educational-pl-7bb2e.firebasestorage.app",
          messagingSenderId: "846163564347",
          appId: "1:846163564347:web:ddcbeb19338d8cae45091e",
          measurementId: "G-8RTKN2BDBS"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const message = document.getElementById("auth-message");

        document.getElementById("signupBtn").addEventListener("click", () => {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            createUserWithEmailAndPassword(auth, email, password)
              .then(() => {
                  message.style.color = "green";
                  message.innerText = "تم إنشاء الحساب وتسجيل الدخول بنجاح! أهلاً بك.";
              })
              .catch((error) => {
                  message.style.color = "red";
                  message.innerText = "خطأ: " + error.message;
              });
        });

        document.getElementById("loginBtn").addEventListener("click", () => {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            signInWithEmailAndPassword(auth, email, password)
              .then(() => {
                  message.style.color = "green";
                  message.innerText = "تم تسجيل الدخول بنجاح! نورت المنصة.";
              })
              .catch((error) => {
                  message.style.color = "red";
                  message.innerText = "خطأ في البريد أو كلمة المرور.";
              });
        });
    </script>
