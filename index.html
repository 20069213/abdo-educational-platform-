<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة عبده سعد التعليمية - تسجيل الدخول</title>
    <style>
        body { 
            font-family: Tahoma, sans-serif; 
            background: linear-gradient(135deg, #0878e8, #0056b3); 
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .box { 
            background: white; 
            width: 90%;
            max-width: 400px; 
            padding: 30px; 
            border-radius: 15px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
            text-align: center; 
        }
        h2 { color: #0878e8; margin-bottom: 5px; }
        p { color: #666; margin-bottom: 20px; font-size: 14px; }
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            border: 1px solid #ddd; 
            border-radius: 8px; 
            box-sizing: border-box;
            font-size: 15px;
        }
        button { 
            background: #0878e8; 
            color: white; 
            border: none; 
            padding: 12px; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 100%; 
            margin-top: 10px; 
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover { background: #0056b3; }
        .signup-btn { background: #28a745; }
        .signup-btn:hover { background: #218838; }
        #message { margin-top: 15px; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

    <div class="box">
        <h2>منصة عبده سعد التعليمية</h2>
        <p>قم بتسجيل الدخول أو إنشاء حساب للبدء</p>
        
        <input type="email" id="email" placeholder="البريد الإلكتروني"><br>
        <input type="password" id="password" placeholder="كلمة المرور"><br>
        
        <button id="loginBtn">تسجيل الدخول</button>
        <button id="signupBtn" class="signup-btn">إنشاء حساب جديد</button>
        
        <p id="message"></p>
    </div>

    <!-- كود فايربيس للتحقق -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDBZGXlXxyNUVJhT12Dq1qKEBtnLuGbMY4",
          authDomain: "abdo-saad-educational-pl-7bb2e.firebaseapp.com",
          projectId: "abdo-saad-educational-pl-7bb2e",
          storageBucket: "abdo-saad-educational-pl-7bb2e.firebasestorage.app",
          messagingSenderId: "846163564347",
          appId: "1:846163564347:web:ddcbeb19338d8cae45091e",
          measurementId: "G-8RTKN2BDBS"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const message = document.getElementById("message");

        document.getElementById("signupBtn").addEventListener("click", () => {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            if(!email || !password) {
                message.style.color = "red";
                message.innerText = "برجاء كتابة البريد وكلمة المرور.";
                return;
            }

            createUserWithEmailAndPassword(auth, email, password)
              .then(() => {
                  message.style.color = "green";
                  message.innerText = "تم إنشاء الحساب بنجاح! جاري فتح المنصة...";
                  setTimeout(() => {
                      window.location.href = "home.html"; // يحوله لصفحة المنصة
                  }, 1200);
              })
              .catch((error) => {
                  message.style.color = "red";
                  message.innerText = "خطأ: " + error.message;
              });
        });

        document.getElementById("loginBtn").addEventListener("click", () => {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            if(!email || !password) {
                message.style.color = "red";
                message.innerText = "برجاء كتابة البريد وكلمة المرور.";
                return;
            }

            signInWithEmailAndPassword(auth, email, password)
              .then(() => {
                  message.style.color = "green";
                  message.innerText = "تم تسجيل الدخول بنجاح! جاري فتح المنصة...";
                  setTimeout(() => {
                      window.location.href = "home.html"; // يحوله لصفحة المنصة
                  }, 1200);
              })
              .catch((error) => {
                  message.style.color = "red";
                  message.innerText = "خطأ في البريد أو كلمة المرور.";
              });
        });
    </script>

</body>
</html>
