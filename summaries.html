<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تلخيص الدروس</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b1220;
      color: white;
      font-family: Arial, sans-serif;
    }

    .header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #26324a;
    }

    .header h1 {
      margin: 0;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 25px 20px;
    }

    .card {
      background: #111c31;
      border: 1px solid #26324a;
      border-radius: 20px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 5px 20px #0005;
    }

    .icon {
      font-size: 50px;
    }

    .card h2 {
      margin: 10px 0;
    }

    .card p {
      color: #aeb8c9;
      line-height: 1.8;
    }

    .price {
      font-size: 25px;
      font-weight: bold;
      margin: 20px 0;
    }

    .whatsapp {
      display: block;
      background: #16a34a;
      color: white;
      text-decoration: none;
      padding: 16px;
      border-radius: 13px;
      font-size: 18px;
      font-weight: bold;
      margin-top: 20px;
    }

    .back {
      display: inline-block;
      margin-top: 20px;
      color: #60a5fa;
      text-decoration: none;
    }

    .lessons {
      display: none;
      margin-top: 25px;
      gap: 15px;
    }

    .lesson {
      background: #18243a;
      padding: 20px;
      border-radius: 15px;
      border: 1px solid #26324a;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>📚 تلخيص الدروس</h1>
  </div>

  <div class="container">

    <div class="card">

      <div class="icon">📚</div>

      <h2>تلخيص الدروس</h2>

      <p>
        اشترك للوصول إلى خمسة ملخصات للدروس.
      </p>

      <div class="price">
        💰 سعر الاشتراك: 100 جنيه
      </div>

      <p>
        للحصول على كود الاشتراك، تواصل مع المطور على واتساب.
      </p>

      <a
        class="whatsapp"
        href="https://wa.me/201124094135?text=أريد%20الاشتراك%20في%20تلخيص%20الدروس%20الخمس%20بسعر%20100%20جنيه%20والحصول%20على%20كود%20الاشتراك"
        target="_blank">
        📱 التواصل مع المطور على واتساب
      </a>

      <a href="home.html" class="back">
        ← العودة للرئيسية
      </a>

    </div>

  </div>

</body>
</html>
