<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - منصة عبده سعد</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .box {
      width: 90%;
      max-width: 380px;
      background: #101b34;
      padding: 30px 20px;
      border-radius: 20px;
      text-align: center;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 17px;
    }

    #message {
      margin-top: 15px;
    }
  </style>
</head>

<body>

<div class="box">
  <h1>📚 منصة عبده سعد</h1>

  <input id="email" type="email" placeholder="البريد الإلكتروني">
  <input id="password" type="password" placeholder="كلمة المرور">

  <button id="loginBtn">تسجيل الدخول</button>
  <button id="signupBtn">إنشاء حساب جديد</button>

  <p id="message"></p>
</div>

<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

  import {
    getAuth,
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


  // ضع firebaseConfig الخاص بمشروعك هنا
  const firebaseConfig = {
    
  };


  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);


  const email = document.getElementById("email");
  const password = document.getElementById("password");
  const message = document.getElementById("message");


  document.getElementById("signupBtn").onclick = async () => {

    try {

      await createUserWithEmailAndPassword(
        auth,
        email.value.trim(),
        password.value
      );

      message.textContent = "تم إنشاء الحساب بنجاح ✅";

    } catch (error) {

      message.textContent = "تعذر إنشاء الحساب.";

    }

  };


  document.getElementById("loginBtn").onclick = async () => {

    try {

      await signInWithEmailAndPassword(
        auth,
        email.value.trim(),
        password.value
      );

      window.location.href = "index.html";

    } catch (error) {

      message.textContent = "البريد الإلكتروني أو كلمة المرور غير صحيحة.";

    const app = initializeApp ( firebaseConfig );
const analytics = getAnalytics ( app );

  
</script>

</body>
</html>
