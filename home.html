    <!-- كود التحقق من تسجيل الدخول وخروج المستخدم -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDBZGXlXxyNUVJhT12Dq1qKEBtnLuGbMY4",
          authDomain: "abdo-saad-educational-pl-7bb2e.firebaseapp.com",
          projectId: "abdo-saad-educational-pl-7bb2e",
          storageBucket: "abdo-saad-educational-pl-7bb2e.firebasestorage.app",
          messagingSenderId: "846163564347",
          appId: "1:846163564347:web:ddcbeb19338d8cae45091e",
          measurementId: "G-8RTKN2BDBS"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // التحقق: لو المستخدم مش مسجل دخول، يرجعه لصفحة تسجيل الدخول (index.html)
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "index.html";
            }
        });

        // زر تسجيل الخروج
        const handleLogout = () => {
            signOut(auth).then(() => {
                window.location.href = "index.html";
            }).catch((error) => {
                console.log(error);
            });
        };

        document.getElementById("logoutBtn").addEventListener("click", handleLogout);
        document.getElementById("bottomLogout").addEventListener("click", handleLogout);
    </script>
