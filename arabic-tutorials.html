<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>الشروحات والمسارات - اللغة العربية</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 25px;
    }

    .back {
      background: #334155;
      color: white;
      text-decoration: none;
      padding: 14px 22px;
      border-radius: 14px;
      font-size: 18px;
    }

    .card {
      max-width: 650px;
      margin: 25px auto;
      padding: 28px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 25px;
    }

    .title {
      text-align: center;
      color: #38bdf8;
      font-size: 30px;
      line-height: 1.4;
      margin-bottom: 25px;
    }

    .lesson-title {
      color: #38bdf8;
      font-size: 25px;
      text-align: center;
      margin-top: 30px;
      padding-bottom: 12px;
      border-bottom: 1px dashed #475569;
    }

    .video {
      display: flex;
      align-items: center;
      gap: 15px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 18px;
      padding: 22px;
      margin-top: 18px;
      color: white;
      text-decoration: none;
      font-size: 20px;
      line-height: 1.5;
    }

    .play {
      color: #ef4444;
      font-size: 35px;
      flex-shrink: 0;
    }

    @media (max-width: 600px) {
      .card {
        margin: 15px;
        padding: 20px;
      }

      .title {
        font-size: 25px;
      }

      .lesson-title {
        font-size: 21px;
      }

      .video {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <div class="top">

    <a href="tutorials.html" class="back">
      ← الرجوع
    </a>

  </div>

  <div class="card">

    <div class="title">
      📺 الشروحات والمسارات - اللغة العربية
    </div>

    <div class="lesson-title">
      📌 المحاضرة التأسيسية في النحو 2027
    </div>

    <a
      href="https://youtu.be/1l6-MzGJ5DA?si=c-NFDsfazTXuMTJs"
      target="_blank"
      class="video">

      <span class="play">▷</span>

      <span>
        المحاضرة التأسيسية في النحو
        مع مستر محمد صلاح
      </span>

    </a>


    <div class="lesson-title">
      📌 المحاضرة التأسيسية في البلاغة 2027
    </div>

    <a
      href="https://youtu.be/xpndcdEmJVs?si=OZ6D-1fKyn-TpPgf"
      target="_blank"
      class="video">

      <span class="play">▷</span>

      <span>
        المحاضرة التأسيسية في البلاغة
        مع مستر محمد صلاح
      </span>

    </a>

  </div>

</body>
</html>
